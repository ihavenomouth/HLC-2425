  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">

<body>
  <h1>Pantalla de registro</h1>
  <p>Volver a <a href="index.html">la pantalla de inicio</a>.</p>

  <form>
    <label>Nombre<br>
      <input type="text" name="txtNombre" id="txtNombre">
    </label>

    <label>Correo electrónico<br>
      <input type="email" name="txtEmail" id="txtEmail">

    <label>Clave<br>

    </label>

    <label>Repita la clave<br>
      <input type="password" name="txtClave2" id="txtClave2">
    </label>

    <input type="reset" value="Reiniciar formulario">
    <button type="button" id="btnCrearUsuario">Crear usuario</button>
  </form>

  <div class="notice" id="divCrearUsuarioInfo"></div>
